version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  rxnet:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  faiss_index:
  uploads:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rxdetect
      POSTGRES_USER: rxuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxuser -d rxdetect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rxnet]

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [rxnet]

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rxuser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rxdetect
      ASYNC_DATABASE_URL: postgresql+asyncpg://rxuser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rxdetect
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # ── Supabase Storage (optional) ─────────────────────────────────────────
      # Set these to enable persistent prescription/report storage in Supabase.
      # Leave blank (or omit) to use local disk storage instead.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - uploads:/app/uploads
      - faiss_index:/app/data/faiss_index
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks: [rxnet]

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rxuser:${POSTGRES_PASSWORD:-changeme}@postgres:5432/rxdetect
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - uploads:/app/uploads
      - faiss_index:/app/data/faiss_index
    command: celery -A app.worker.celery_app worker --loglevel=info -Q analysis --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [rxnet]

  # ── Flower (Celery monitoring UI) ────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on: [redis, celery_worker]
    networks: [rxnet]
