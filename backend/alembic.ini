# alembic.ini
# Place this file in the backend/ directory (same level as app/).
# Run migrations from backend/ with:   alembic upgrade head

[alembic]
# sqlalchemy.url is overridden programmatically in env.py from pydantic Settings.
# Leave this as a placeholder — do NOT hard-code credentials here.
script_location = alembic

# Template for new revision filenames.
# %(year)d%(month).2d%(day).2d_%(rev)s_%(slug)s.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with this directory so app imports work inside env.py.
prepend_sys_path = .

# Timezone for revision timestamps.
timezone = UTC

# Maximum revision IDs to display in history.
truncate_slug_length = 40

# Revision environment.
revision_environment = false

# Output encoding.
output_encoding = utf-8

# SQLAlchemy URL placeholder (overridden in env.py).
sqlalchemy.url = postgresql://placeholder/placeholder


[post_write_hooks]
# Optional: run ruff/black on generated migration files.
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S